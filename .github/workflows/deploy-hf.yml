# HuggingFace Spaces Deployment Workflow
name: Deploy to HuggingFace Spaces

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  HF_SPACE_REPO: "your-username/icclexai-platform"
  
jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'apps/frontend/package-lock.json'
        
    - name: Install frontend dependencies
      run: |
        cd apps/frontend
        npm ci
        
    - name: Build React frontend
      run: |
        cd apps/frontend
        npm run build:hf
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        pip install huggingface_hub
        
    - name: Deploy to HuggingFace Space
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        # Create deployment package
        mkdir -p hf-deployment
        
        # Copy React build
        cp -r apps/frontend/dist/* hf-deployment/
        
        # Copy backend
        cp -r apps/backend/* hf-deployment/
        cp requirements.txt hf-deployment/
        
        # Create HF-specific files
        cat > hf-deployment/app.py << 'EOF'
        import gradio as gr
        import subprocess
        import threading
        import time
        import requests
        import os
        
        # Start FastAPI backend
        def start_backend():
            subprocess.Popen(["uvicorn", "fast_api_backend:app", "--host", "0.0.0.0", "--port", "7861"])
            
        # Start backend in thread
        threading.Thread(target=start_backend, daemon=True).start()
        time.sleep(5)  # Wait for backend to start
        
        # Create Gradio interface that embeds React frontend
        with gr.Blocks(title="ICCLexAI - AI-Powered Legal Case Analysis") as demo:
            gr.HTML("""
            <div style="text-align: center; margin-bottom: 20px;">
                <h1>🏛️ ICCLexAI Platform</h1>
                <p>AI-Powered Evidence Analysis for International Criminal Court Submissions</p>
            </div>
            """)
            
            with gr.Row():
                gr.HTML("""
                <iframe src="/static" width="100%" height="800px" frameborder="0"></iframe>
                """)
        
        if __name__ == "__main__":
            demo.launch(server_name="0.0.0.0", server_port=7860, share=False)
        EOF
        
        cat > hf-deployment/Dockerfile << 'EOF'
        FROM python:3.11-slim
        
        WORKDIR /app
        
        # Install system dependencies
        RUN apt-get update && apt-get install -y \
            curl \
            && rm -rf /var/lib/apt/lists/*
        
        # Copy requirements and install Python deps
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        RUN pip install gradio uvicorn
        
        # Copy application
        COPY . .
        
        # Expose port
        EXPOSE 7860
        
        # Run the application
        CMD ["python", "app.py"]
        EOF
        
        cat > hf-deployment/README.md << 'EOF'
        ---
        title: ICCLexAI Platform
        emoji: 🏛️
        colorFrom: blue
        colorTo: purple
        sdk: docker
        app_port: 7860
        pinned: false
        license: mit
        ---
        
        # ICCLexAI - AI-Powered Legal Case Analysis
        
        An innovative platform that automates ICC (International Criminal Court) submission processing using advanced AI models.
        
        ## Features
        
        - 📄 **Multimodal Analysis**: Process documents, images, videos, and audio files
        - 🤖 **AI-Generated Summaries**: 500-2000 word legal case summaries
        - 📊 **Metadata Extraction**: Automatic extraction of timestamps, locations, and evidence details
        - 🎯 **Human-AI Collaboration**: AI generates drafts, humans approve and refine
        - ⚡ **Real-time Processing**: Lightning-fast analysis using Groq LLMs
        
        ## How it Works
        
        1. **Upload Evidence**: Submit various file types (documents, media, etc.)
        2. **AI Processing**: Advanced LLMs analyze content and extract metadata
        3. **Case Generation**: AI creates comprehensive legal case documents
        4. **Human Review**: Legal professionals review and approve AI-generated content
        5. **ICC Submission**: Enriched, professional-grade submissions ready for ICC
        
        ## Technology Stack
        
        - **Frontend**: React + TypeScript + TailwindCSS
        - **Backend**: FastAPI + Python
        - **AI Models**: Groq (Llama, Mixtral), Google Vision AI
        - **Processing**: Computer Vision, Speech Recognition, Document Analysis
        EOF
        
        # Deploy to HuggingFace
        python -c "
        from huggingface_hub import HfApi
        api = HfApi()
        api.upload_folder(
            folder_path='hf-deployment',
            repo_id='$HF_SPACE_REPO',
            repo_type='space',
            token='$HF_TOKEN'
        )
        "
