[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Don't try to build as a package - this is a script collection
bypass-selection = true

[project]
name = "icclexai"
version = "2.0.0"
description = "ICCLexAI - Multimodal AI-powered evidence analysis for International Criminal Court submissions"
authors = [
    {name = "ICCLexAI Team", email = "info@icclexai.org"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

dependencies = [
    # Core web framework
    "streamlit>=1.29.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    # AI and ML
    "groq>=0.4.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.1",
    # Computer Vision and Media Processing
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    # Audio Processing
    "speechrecognition>=3.10.0",
    "mutagen>=1.47.0",
    # Document Processing
    "pymupdf>=1.23.0",
    "python-docx>=0.8.11",
    "exifread>=3.0.0",
    # Web Automation
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
    # Data Processing and Visualization
    "pandas>=2.1.0",
    "plotly>=5.17.0",
    # Geolocation
    "geopy>=2.3.0",
    "geocoder>=1.38.1",
    # HTTP and Networking
    "requests>=2.31.0",
    "httpx>=0.25.0",
    # Caching and Storage
    "redis>=5.0.0",
    "aiofiles>=23.2.1",
    # Configuration and Environment
    "python-dotenv>=1.0.0",
    # Web Scraping
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    # API and Data Handling
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    # Validation
    "validators>=0.22.0",
    "watchdog>=6.0.0",
    "watchfiles>=1.1.0",
    # Case database, migrations and spatial types
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    # Submission package PDF
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.black]
line-length = 88
target-version = ['py39']
