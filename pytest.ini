# Test configuration
[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --disable-warnings -v
markers =
    unit: Unit tests
    integration: Integration tests
    ai: AI model tests
    slow: Slow tests

# Coverage configuration
[coverage:run]
source = .
omit = 
    */venv/*
    */env/*
    */.venv/*
    */tests/*
    setup.py
    conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
